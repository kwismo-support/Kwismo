version: '3.8'

services:
  kwismo-ai:
    build:
      context: ./kwismo-ai
      dockerfile: Dockerfile
    container_name: kwismo-ai
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kwismo-backend:
    build:
      context: ./kwismo-backend
      dockerfile: Dockerfile
    container_name: kwismo-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_TYPE=sqlite
      - AI_SERVICE_URL=http://kwismo-ai:8001
      - JWT_SECRET=kwismo_super_secret_jwt_key_render_2026
    depends_on:
      kwismo-ai:
        condition: service_healthy
    restart: unless-stopped
