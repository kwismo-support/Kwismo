name: KWISMO Mobile — Automated EAS OTA Updates

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'kwismo-mobile/**'
      - '.github/workflows/mobile-eas-update.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to publish (auto, production, staging, preview)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - production
          - staging
          - preview

jobs:
  publish-ota:
    name: Publish Mobile OTA Update (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: kwismo-mobile/package-lock.json

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: kwismo-mobile
        run: npm ci

      - name: Auto-Optimize Mobile Assets
        working-directory: kwismo-mobile
        run: npm run optimize

      - name: Resolve Target Environment
        id: resolve-env
        run: |
          TARGET="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"

          if [ -n "$TARGET" ] && [ "$TARGET" != "auto" ]; then
            ENV_NAME="$TARGET"
          elif [ "$BRANCH" = "main" ]; then
            ENV_NAME="production"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_NAME="staging"
          elif [ "$BRANCH" = "dev" ]; then
            ENV_NAME="preview"
          else
            ENV_NAME="preview"
          fi

          echo "Selected target environment: $ENV_NAME"
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

          if [ "$ENV_NAME" = "production" ]; then
            echo "channel=production" >> $GITHUB_OUTPUT
            echo "app_env=production" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
          elif [ "$ENV_NAME" = "staging" ]; then
            echo "channel=staging" >> $GITHUB_OUTPUT
            echo "app_env=staging" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo-Staging" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL_STAGING || 'https://api-staging.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
          else
            echo "channel=preview" >> $GITHUB_OUTPUT
            echo "app_env=preview" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo-Dev" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL_DEV || 'https://api-dev.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish EAS OTA Update
        working-directory: kwismo-mobile
        env:
          APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
          EXPO_PUBLIC_API_URL: ${{ steps.resolve-env.outputs.api_url }}
          EXPO_PUBLIC_APP_ENV: ${{ steps.resolve-env.outputs.app_env }}
          EXPO_PUBLIC_APP_NAME: ${{ steps.resolve-env.outputs.app_name }}
          EXPO_PUBLIC_USE_MOCK_DATA: 'false'
        run: |
          echo "Publishing EAS OTA update to branch '${{ steps.resolve-env.outputs.channel }}' with API ${{ steps.resolve-env.outputs.api_url }}..."
          eas update --auto --branch ${{ steps.resolve-env.outputs.channel }} --non-interactive
