name: KWISMO Mobile — Cloudflare Real-Time OTA Updates

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'kwismo-mobile/**'
      - '.github/workflows/mobile-cloudflare-ota.yml'
  workflow_dispatch:

jobs:
  publish-cloudflare-ota:
    name: Publish Instant Cloudflare OTA Edge Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: kwismo-mobile/package-lock.json

      - name: Install Dependencies
        working-directory: kwismo-mobile
        run: npm ci

      - name: Write .env for Staging (Test App)
        if: github.ref == 'refs/heads/staging'
        working-directory: kwismo-mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL_PREVIEW || 'https://api.kwismo.com/api/v1' }}" > .env
          echo "EXPO_PUBLIC_USE_MOCK_DATA=false" >> .env
          echo "EXPO_PUBLIC_APP_ENV=preview" >> .env
          echo "EXPO_PUBLIC_APP_NAME=Kwismo-Test" >> .env
          echo "EXPO_PUBLIC_DEFAULT_LANG=fr" >> .env

      - name: Write .env for Main (Production App)
        if: github.ref == 'refs/heads/main'
        working-directory: kwismo-mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.kwismo.com/api/v1' }}" > .env
          echo "EXPO_PUBLIC_USE_MOCK_DATA=false" >> .env
          echo "EXPO_PUBLIC_APP_ENV=production" >> .env
          echo "EXPO_PUBLIC_APP_NAME=Kwismo" >> .env
          echo "EXPO_PUBLIC_DEFAULT_LANG=fr" >> .env

      - name: Export Optimized Metro JS Bundle
        working-directory: kwismo-mobile
        env:
          NODE_ENV: production
        run: |
          npx expo export --clear --output-dir dist
          find dist -name "*.map" -type f -delete || true

      - name: Deploy JS Bundle & Assets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create kwismo-mobile-ota --production-branch=main || true
          npx wrangler pages deploy kwismo-mobile/dist --project-name=kwismo-mobile-ota --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Deploy Cloudflare Edge OTA Worker
        working-directory: kwismo-mobile/cloudflare/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy || true

      - name: Publish Update Manifest to Cloudflare Edge Worker
        env:
          OTA_WORKER_URL: ${{ secrets.CLOUDFLARE_OTA_WORKER_URL }}
          OTA_SECRET_TOKEN: ${{ secrets.CLOUDFLARE_OTA_SECRET_TOKEN || 'kwismo-ota-secret-key-2026' }}
        run: |
          if [ -n "$OTA_WORKER_URL" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            TIMESTAMP=$(date +%s%3N)
            curl -s -f -X POST "$OTA_WORKER_URL/api/publish-manifest" \
              -H "Content-Type: application/json" \
              -H "X-Cloudflare-OTA-Token: $OTA_SECRET_TOKEN" \
              -d "{\"branch\":\"$BRANCH_NAME\",\"version\":\"1.0.0\",\"bundleUrl\":\"https://kwismo-mobile-ota.pages.dev/index.bundle\",\"timestamp\":$TIMESTAMP}" || true
          else
            echo "CLOUDFLARE_OTA_WORKER_URL is not set. Skipping Worker notification."
          fi
