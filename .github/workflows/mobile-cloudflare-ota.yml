name: KWISMO Mobile — Cloudflare Real-Time OTA Updates

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'kwismo-mobile/**'
      - '.github/workflows/mobile-cloudflare-ota.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to publish (auto, production, staging, dev)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - production
          - staging
          - dev

jobs:
  publish-cloudflare-ota:
    name: Publish Instant Cloudflare OTA Edge Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: kwismo-mobile/package-lock.json

      - name: Install Dependencies
        working-directory: kwismo-mobile
        run: npm ci

      - name: Resolve Target Environment
        id: resolve-env
        run: |
          TARGET="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"

          if [ -n "$TARGET" ] && [ "$TARGET" != "auto" ]; then
            ENV_NAME="$TARGET"
          elif [ "$BRANCH" = "main" ]; then
            ENV_NAME="production"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_NAME="staging"
          elif [ "$BRANCH" = "dev" ]; then
            ENV_NAME="dev"
          else
            ENV_NAME="dev"
          fi

          echo "Selected target environment: $ENV_NAME"
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

          if [ "$ENV_NAME" = "production" ]; then
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo" >> $GITHUB_OUTPUT
            echo "app_env=production" >> $GITHUB_OUTPUT
            echo "cf_branch=main" >> $GITHUB_OUTPUT
          elif [ "$ENV_NAME" = "staging" ]; then
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL_PREVIEW || secrets.EXPO_PUBLIC_API_URL_STAGING || 'https://api.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo-Test" >> $GITHUB_OUTPUT
            echo "app_env=preview" >> $GITHUB_OUTPUT
            echo "cf_branch=staging" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.EXPO_PUBLIC_API_URL_DEV || 'https://api-dev.kwismo.com/api/v1' }}" >> $GITHUB_OUTPUT
            echo "app_name=Kwismo-Dev" >> $GITHUB_OUTPUT
            echo "app_env=dev" >> $GITHUB_OUTPUT
            echo "cf_branch=dev" >> $GITHUB_OUTPUT
          fi

      - name: Write .env Configuration
        working-directory: kwismo-mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ steps.resolve-env.outputs.api_url }}" > .env
          echo "EXPO_PUBLIC_USE_MOCK_DATA=false" >> .env
          echo "EXPO_PUBLIC_APP_ENV=${{ steps.resolve-env.outputs.app_env }}" >> .env
          echo "EXPO_PUBLIC_APP_NAME=${{ steps.resolve-env.outputs.app_name }}" >> .env
          echo "EXPO_PUBLIC_DEFAULT_LANG=fr" >> .env

      - name: Export Optimized Metro JS Bundle
        working-directory: kwismo-mobile
        env:
          NODE_ENV: production
        run: |
          npx expo export --clear --output-dir dist
          find dist -name "*.map" -type f -delete || true

      - name: Deploy JS Bundle & Assets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create kwismo-mobile-ota --production-branch=main || true
          npx wrangler pages deploy kwismo-mobile/dist --project-name=kwismo-mobile-ota --branch=${{ steps.resolve-env.outputs.cf_branch }} --commit-dirty=true

      - name: Deploy Cloudflare Edge OTA Worker
        working-directory: kwismo-mobile/cloudflare/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy || true

      - name: Publish Update Manifest to Cloudflare Edge Worker
        env:
          OTA_WORKER_URL: ${{ secrets.CLOUDFLARE_OTA_WORKER_URL }}
          OTA_SECRET_TOKEN: ${{ secrets.CLOUDFLARE_OTA_SECRET_TOKEN || 'kwismo-ota-secret-key-2026' }}
        run: |
          if [ -n "$OTA_WORKER_URL" ]; then
            BRANCH_NAME="${{ steps.resolve-env.outputs.cf_branch }}"
            TIMESTAMP=$(date +%s%3N)
            curl -s -f -X POST "$OTA_WORKER_URL/api/publish-manifest" \
              -H "Content-Type: application/json" \
              -H "X-Cloudflare-OTA-Token: $OTA_SECRET_TOKEN" \
              -d "{\"branch\":\"$BRANCH_NAME\",\"version\":\"1.0.0\",\"bundleUrl\":\"https://kwismo-mobile-ota.pages.dev/index.bundle\",\"timestamp\":$TIMESTAMP}" || true
          else
            echo "CLOUDFLARE_OTA_WORKER_URL is not set. Skipping Worker notification."
          fi
