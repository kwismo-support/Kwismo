name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'kwismo-backend/**'
      - 'kwismo-ai/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (prod, staging, dev, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - prod
          - staging
          - dev

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH Key Secret
        id: check-secret
        env:
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning ::Le secret GitHub 'AWS_EC2_SSH_KEY' n'est pas encore configuré. Veuillez l'ajouter dans GitHub Settings > Secrets > Actions."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment target
        id: env-target
        run: |
          TARGET="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "all" ]; then
            echo "target=$TARGET" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ] || [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "target=staging" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "target=dev" >> $GITHUB_OUTPUT
          else
            echo "target=all" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to AWS EC2 via SSH
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          TARGET: ${{ steps.env-target.outputs.target }}
        run: |
          python3 - << 'EOF'
          import os, sys

          raw = os.environ.get("SSH_KEY", "").strip()
          if not raw:
              print("::error ::Le secret AWS_EC2_SSH_KEY est vide.", file=sys.stderr)
              sys.exit(1)

          # Nettoyer d'éventuels guillemets englobants
          if (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
              raw = raw[1:-1].strip()

          # Traiter les sauts de ligne échappés (\n textuels au lieu de vrais sauts de ligne)
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n")

          # Décoder si la clé a été encodée en base64
          if "BEGIN" not in raw:
              import base64
              try:
                  decoded = base64.b64decode(raw).decode('utf-8', errors='ignore')
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass

          # Découper proprement en lignes sans \r
          lines = [line.strip() for line in raw.replace("\r\n", "\n").replace("\r", "\n").split("\n") if line.strip()]

          if not any("BEGIN" in l for l in lines):
              print("::error ::Le secret 'AWS_EC2_SSH_KEY' ne contient pas de clé OpenSSH/PEM valide (doit contenir '-----BEGIN ... PRIVATE KEY-----').", file=sys.stderr)
              print("Si vous disposez d'un fichier .ppk (PuTTY), convertissez-le en clé OpenSSH avec PuTTYgen avant de l'enregistrer dans GitHub Secrets.", file=sys.stderr)
              sys.exit(1)

          cleaned_key = "\n".join(lines) + "\n"
          key_path = os.path.expanduser("~/.ssh/deploy_key")
          os.makedirs(os.path.dirname(key_path), exist_ok=True)
          with open(key_path, "w", encoding="utf-8", newline="\n") as f:
              f.write(cleaned_key)

          os.chmod(key_path, 0o600)
          print(f"Cle SSH installee avec succes ({len(lines)} lignes detectees).")
          EOF

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i ~/.ssh/deploy_key ubuntu@52.45.215.39 "sudo /opt/kwismo/scripts/deploy.sh $TARGET"
